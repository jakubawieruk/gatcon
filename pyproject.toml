[tool.poetry]
name = "gatcon"
version = "0.1.0"
description = "This is the LoRaWAN Gateway configurator CLI tool"
authors = ["jakubawieruk <jakubawieruk@gmail.com>"]
readme = "README.md"
packages = [
    { include = "config.py" },
    { include = "gatcon.py" },
    { include = "gateways" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
click = "^8.4.1"
paramiko = "^5.0.0"
scp = ">=0.15,<0.17"
pyinstaller = "^6.20.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.15,<0.17.0"
mypy = "^2.1.0"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
types-paramiko = ">=4.0.0.20260518,<6.0.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
gatcon = "gatcon:cli"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["config", "gatcon", "gateways"]

