[tool.poetry]
name = "gatcon"
version = "0.0.2"
description = "This is the LoRaWAN Gateway configurator CLI tool"
authors = ["jakubawieruk <jakubawieruk@gmail.com>"]
readme = "README.md"
packages = [
    { include = "config.py" },
    { include = "gatcon.py" },
    { include = "gateways" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
click = "^8.4.1"
paramiko = "^5.0.0"
cryptography = "^48.0.0"

scp = "^0.15.0"
pyinstaller = "^6.20.0"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
gatcon = "gatcon:cli"

